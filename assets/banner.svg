<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Text Highlight Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="pulse-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .matrix-grid {
        stroke: #334155;
        stroke-width: 0.5;
        opacity: 0.25;
      }
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .node-beam {
        stroke-dasharray: 8 12;
        animation: flow 20s linear infinite;
      }
      .shimmer {
        animation: shimmer 6s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(0.96); opacity: 0.4; }
        100% { transform: scale(1.04); opacity: 0.85; }
      }
      @keyframes flow {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes shimmer {
        0% { opacity: 0.6; }
        50% { opacity: 1; }
        100% { opacity: 0.6; }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
      .mono-pill {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />

  <!-- Subtle High-Tech Grid -->
  <g class="matrix-grid">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Ambient Glowing Background Spheres -->
  <circle cx="1020" cy="110" r="140" fill="#38bdf8" opacity="0.12" filter="url(#pulse-glow)" class="pulse-circle" />
  <circle cx="930" cy="310" r="170" fill="#818cf8" opacity="0.12" filter="url(#pulse-glow)" class="pulse-circle" />
  <circle cx="120" cy="80" r="120" fill="#6366f1" opacity="0.08" filter="url(#pulse-glow)" />

  <!-- Dynamic Network Connection Vectors in Background -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.3" class="node-beam">
    <path d="M 850 130 L 980 90 L 1100 170 L 1020 280 L 880 240 Z" fill="none" />
    <line x1="980" y1="90" x2="1020" y2="280" />
    <line x1="850" y1="130" x2="1100" y2="170" />
  </g>

  <!-- Floating Resilience Nodes in Right Background -->
  <g transform="translate(850, 60)" opacity="0.95">
    <!-- Node 1: Entra / AD -->
    <rect x="90" y="10" width="130" height="42" rx="8" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="108" cy="31" r="5" fill="#38bdf8" />
    <text x="122" y="36" fill="#f8fafc" class="mono-pill">Entra / AD</text>

    <!-- Node 2: ITDR / Recovery -->
    <rect x="180" y="100" width="150" height="42" rx="8" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="198" cy="121" r="5" fill="#818cf8" />
    <text x="212" y="126" fill="#f8fafc" class="mono-pill">ITDR &amp; Recovery</text>

    <!-- Node 3: Zero Trust MFA -->
    <rect x="40" y="160" width="140" height="42" rx="8" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="58" cy="181" r="5" fill="#a855f7" />
    <text x="72" y="186" fill="#f8fafc" class="mono-pill">Zero Trust MFA</text>

    <!-- Node 4: Forest Backup -->
    <rect x="120" y="240" width="160" height="42" rx="8" fill="url(#card-grad)" stroke="#34d399" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="138" cy="261" r="5" fill="#34d399" />
    <text x="152" y="266" fill="#f8fafc" class="mono-pill">Forest Cyber-Safe</text>
  </g>

  <!-- Central / Left Foreground Content (Strictly readable and in foreground) -->
  <g transform="translate(80, 0)">
    
    <!-- Shield Resilience Icon -->
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="60" height="60" rx="14" fill="#0f172a" stroke="url(#shield-grad)" stroke-width="2" filter="url(#glow)" />
      <!-- Shield Shape -->
      <path d="M 30 14 L 46 20 C 46 34 39 44 30 48 C 21 44 14 34 14 20 Z" fill="none" stroke="url(#cyan-glow)" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Keyhole / Identity Lock -->
      <circle cx="30" cy="27" r="3.5" fill="#38bdf8" />
      <path d="M 28 30.5 L 32 30.5 L 33 39 L 27 39 Z" fill="#38bdf8" />
    </g>

    <!-- Category Pill Badge -->
    <g transform="translate(76, 82)">
      <rect x="0" y="0" width="280" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="15" r="4" fill="#38bdf8" />
      <text x="26" y="20" fill="#94a3b8" class="mono-pill" font-size="11">IDENTITY PROVIDER &amp; DIRECTORY RESILIENCE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="180" fill="#f8fafc" class="title-text" font-size="44">
      Identity Provider &amp; Directory
    </text>
    <text x="0" y="234" fill="url(#text-grad)" class="title-text" font-size="44" filter="url(#glow)">
      Resilience Ecosystem
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="280" fill="#cbd5e1" class="sub-text" font-size="17">
      Curated Guide to Enterprise ITDR, Disaster Recovery, Active Directory Hardening,
    </text>
    <text x="0" y="306" fill="#94a3b8" class="sub-text" font-size="15">
      Identity Threat Detection, Hybrid Identity Governance &amp; Open-Source Alternatives.
    </text>

    <!-- Interactive / Status Pills in Foreground -->
    <g transform="translate(0, 340)">
      <!-- Pill 1: Enterprise SaaS -->
      <rect x="0" y="0" width="135" height="32" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.2" />
      <text x="14" y="21" fill="#38bdf8" class="mono-pill">⚡ Enterprise SaaS</text>

      <!-- Pill 2: Open Source -->
      <rect x="150" y="0" width="150" height="32" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" />
      <text x="164" y="21" fill="#a5b4fc" class="mono-pill">🌐 Open-Source Core</text>

      <!-- Pill 3: ITDR & Posture -->
      <rect x="315" y="0" width="170" height="32" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <text x="329" y="21" fill="#6ee7b7" class="mono-pill">🛡️ Forest &amp; IdP Backup</text>
    </g>
  </g>
</svg>
